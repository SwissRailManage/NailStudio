<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nagelprobe: Foto deiner Hand aufnehmen und Gelnägel live darauf gestalten.">
<meta name="theme-color" content="#A01E5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A01E5E'/%3E%3Cpath d='M22 50c-3-14-2-36 10-40 12 4 13 26 10 40z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Nagelprobe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500;1,6..96,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: dunkle Foto-Bühne wie ein Leuchttisch, daneben (am Handy darunter) die Werkbank.
   Farben hängen als kleine Nageltips wie am Musterfächer im Studio. */
:root{
  --bg:#F3EFF2; --surface:#FFFFFF; --sunken:#E9E3E8; --line:#D9D0D8;
  --ink:#241923; --muted:#6F6073;
  --accent:#A01E5E; --on-accent:#FFFFFF; --accent-soft:#F6DDE9;
  --stage:#1B141A; --stage-ink:#F6EEF3; --stage-chip:rgba(27,20,26,.74); --stage-line:rgba(255,255,255,.22);
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171218; --surface:#221A23; --sunken:#2C222D; --line:#3D313E;
    --ink:#F4ECF2; --muted:#B09FB1;
    --accent:#F277AE; --on-accent:#2B0A1B; --accent-soft:#4A1F35;
    --stage:#0E0A0E; --stage-ink:#F6EEF3; --stage-chip:rgba(14,10,14,.78); --stage-line:rgba(255,255,255,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171218; --surface:#221A23; --sunken:#2C222D; --line:#3D313E;
  --ink:#F4ECF2; --muted:#B09FB1;
  --accent:#F277AE; --on-accent:#2B0A1B; --accent-soft:#4A1F35;
  --stage:#0E0A0E; --stage-ink:#F6EEF3; --stage-chip:rgba(14,10,14,.78); --stage-line:rgba(255,255,255,.2);
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,label{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Kopfzeile */
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1;margin:0 auto 0 0;min-width:0;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap;cursor:pointer;user-select:none}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.small{min-height:34px;padding:0 12px;font-size:14px}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}

/* Arbeitsfläche */
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px)}
.stage{position:relative;background:var(--stage);min-height:0;min-width:0;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--stage-line);
  background:var(--stage-chip);color:var(--stage-ink);font-size:13px;font-weight:500;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip svg{width:16px;height:16px}
.chip.sq{width:36px;padding:0;justify-content:center}
.chip[aria-pressed="true"]{background:var(--stage-ink);color:var(--stage)}
.stage .tl,.stage .bl,.stage .br{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.stage .tl{top:10px;left:10px;right:10px;pointer-events:none}
.stage .bl{bottom:10px;left:10px}
.stage .br{bottom:10px;right:10px}
.badge{pointer-events:none}

.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 10px 10px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.target{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 16px;overflow-x:auto;flex:none;border-bottom:1px solid var(--line);scrollbar-width:none}
.target::-webkit-scrollbar{display:none}
.target .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none;margin-right:2px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;flex:none}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:18px}
.pane{display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-style:italic;font-weight:500;font-size:20px;line-height:1.15;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13.5px;margin:0;max-width:60ch}

.grid{display:grid;gap:8px}
.grid.looks{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.grid.opts{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 9px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);text-align:left;min-width:0}
.card canvas{width:100%;height:auto;display:block;border-radius:6px;background:var(--sunken)}
.card .nm{font-weight:600;font-size:14px;line-height:1.2}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.25}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;font-size:15px;line-height:1;padding:0}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 7px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:12.5px;line-height:1.15;text-align:center;min-width:0}
.opt canvas{width:44px;height:60px;display:block}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:600}

/* Farben als Nageltips */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;min-width:0}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.slot .t{font-size:12px;color:var(--muted);display:block}
.slot .n{font-weight:600;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot>span:last-child{min-width:0}
.tip{display:block;flex:none;width:26px;height:38px;border-radius:50% 50% 34% 34% / 62% 62% 20% 20%;border:1px solid var(--line);position:relative;overflow:hidden}
.tip::after{content:"";position:absolute;left:24%;top:14%;width:16%;height:52%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0))}
.fan{display:flex;flex-wrap:wrap;gap:7px 6px}
.sw{border:0;background:none;padding:3px;border-radius:12px;line-height:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.own{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.own input[type=color]{width:46px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.field{display:flex;flex-direction:column;gap:4px}
.field .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.field output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:30;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:40;background:var(--stage-chip);display:grid;place-items:center;padding:16px}
.sheet .box{background:var(--surface);border-radius:14px;padding:14px;max-width:min(520px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;overflow:auto}
.sheet img,.sheet video{max-width:100%;max-height:62vh;object-fit:contain;border-radius:8px;background:var(--stage)}

@media (max-width:820px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(220px,46%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .target{flex-wrap:nowrap}
  .brand{font-size:23px}
  .bar{padding:8px 16px}
  .btn{padding:0 12px}
  .btn .opt-txt{display:none}
  .btn.icon-narrow{width:40px;padding:0}
  .grid.looks{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.card,.opt,.pill{transition:border-color .12s,box-shadow .12s,background-color .12s}
}
</style>
</head>
<body>

<header class="bar">
  <h1 class="brand">Nagelprobe</h1>
  <label class="btn primary" for="camInput">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
    <span>Foto<span class="opt-txt"> aufnehmen</span></span>
    <input class="vh" id="camInput" type="file" accept="image/*" capture="environment">
  </label>
  <label class="btn icon-narrow" for="fileInput" title="Foto aus der Galerie wählen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4.5 3.5 3L16 12l4 4"/></svg>
    <span class="opt-txt">Galerie</span><span class="vh">Foto aus der Galerie wählen</span>
    <input class="vh" id="fileInput" type="file" accept="image/*">
  </label>
  <button class="btn" id="saveBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 19.5h14"/></svg>
    Sichern
  </button>
</header>

<main class="work">
  <section class="stage" id="stage" aria-label="Foto mit Nageldesign">
    <canvas id="cv"></canvas>
    <div class="tl"><span class="chip badge" id="demoBadge">Beispielhand – mach oben ein Foto deiner eigenen Hand</span></div>
    <div class="bl">
      <button class="chip" id="beforeBtn" type="button" aria-pressed="false" title="Gedrückt halten für das Original">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>Vorher</button>
      <button class="chip" id="undoBtn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L4 9l4 4"/><path d="M4 9h10a5.5 5.5 0 010 11h-3"/></svg>Rückgängig</button>
    </div>
    <div class="br">
      <button class="chip sq" id="zoomOut" type="button" aria-label="Verkleinern">−</button>
      <button class="chip sq" id="zoomIn" type="button" aria-label="Vergrössern">+</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="target" id="target"></div>
    <div class="body" id="body"></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h2>Dein Bild</h2>
    <img id="sheetImg" alt="Dein Nageldesign auf dem Foto">
    <p class="hint">Halte das Bild gedrückt (am Computer: Rechtsklick) und wähle «Bild sichern».</p>
    <button class="btn primary" id="sheetClose" type="button">Schliessen</button>
  </div>
</div>

<div class="sheet" id="cam" hidden>
  <div class="box">
    <h2>Foto aufnehmen</h2>
    <video id="camVideo" autoplay playsinline muted></video>
    <p class="hint">Handrücken zur Kamera, Finger leicht gespreizt, helles Licht.</p>
    <div class="rowbtns">
      <button class="btn primary" id="camShot" type="button">Auslösen</button>
      <button class="btn" id="camCancel" type="button">Abbrechen</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Kataloge ---------- */
const FINGERS=["Daumen","Zeigefinger","Mittelfinger","Ringfinger","Kleiner Finger"];
const SHAPES=[["round","Rund"],["oval","Oval"],["square","Square"],["squoval","Squoval"],["mandel","Mandel"],["stiletto","Stiletto"],["ballerina","Ballerina"],["lipstick","Lipstick"]];

  ["halfmoon","Halbmond"],["colorblock","Colorblock"],["dots","Punkte"],["stripes","Streifen"],["karo","Karo"],["swirl","Swirls"],
  ["marble","Marmor"],["flowers","Blumen"],["hearts","Herzen"],["stars","Sterne"],["leo","Leo"],["glitterfade","Glitzer-Verlauf"]];
const RANDOM_PATTERNS=["marble","flowers","hearts","stars","leo","glitterfade"];
const FINISHES=[["gloss","Glanz"],["matte","Matt"],["chrome","Chrom"],["cateye","Cat-Eye"],["glitter","Glitzer"],["aurora","Perlmutt"],["jelly","Jelly"]];
const COLORS=[
 ["Nude & Rosé",[["Milchbad","#F3E1DC"],["Ballettschuh","#F2CFCB"],["Rosenquarz","#E9B4B6"],["Nude Sand","#DDB59F"],["Karamell","#C68E6E"],["Taupe","#A38F88"],["Mokka","#7B4B3A"]]],
 ["Rot & Beere",[["Klatschmohn","#D9301F"],["Kirsche","#B5132B"],["Rouge Noir","#4E0E1A"],["Koralle","#F2695C"],["Flamingo","#F24C8D"],["Himbeere","#C2255C"],["Fuchsia","#D61F8C"],["Brombeere","#6B1848"]]],
 ["Pastell",[["Flieder","#C9B6E6"],["Babyblau","#B5D4EE"],["Minze","#B9E3CE"],["Pistazie","#CFE0A6"],["Buttergelb","#F6E7A1"],["Pfirsich","#F9C5A3"]]],
 ["Kräftig",[["Kobalt","#1F3FB8"],["Türkis","#17A5A3"],["Smaragd","#0F6B4F"],["Limette","#B6D62B"],["Sonnengelb","#F2C417"],["Mandarine","#F28A1E"],["Violett","#6C3FC0"]]],
 ["Dunkel & Hell",[["Schwarz","#141316"],["Mitternacht","#15183A"],["Tanne","#143328"],["Schiefer","#4A4F5A"],["Elfenbein","#F1EADB"],["Schneeweiss","#FBFAF8"]]],

];

const nameOf=(list,k)=>(list.find(x=>x[0]===k)||[k,k])[1];

const D=(shape,len,color,color2,pattern,finish)=>({shape,len,color,color2:color2||"#FBFAF8",pattern:pattern||"uni",finish:finish||"gloss"});
const LOOKS=[
 {g:"Klassiker",name:"Milchbad",sub:"Mandel, milchiges Rosé",d:D("mandel",1.5,"#F3E1DC")},
 {g:"Klassiker",name:"French",sub:"Squoval, weisse Spitze",d:D("squoval",1.25,"#EFC9BD","#FDFCFA","french")},

 {g:"Klassiker",name:"Rouge Noir",sub:"Oval, tiefes Weinrot",d:D("oval",1.5,"#4E0E1A")},
 {g:"Klassiker",name:"Schwarz matt",sub:"Ballerina, Gold-French am Ringfinger",d:D("ballerina",2,"#141316","#C9A04A","uni","matte"),o:{3:{pattern:"french",finish:"gloss"}}},
 {g:"Trends",name:"Glazed",sub:"Perlmutt-Schimmer",d:D("mandel",1.6,"#F3E1DC","#FBFAF8","uni","aurora")},
 {g:"Trends",name:"Spiegelchrom",sub:"Ballerina, Silber",d:D("ballerina",2.1,"#BFC2C9","#FBFAF8","uni","chrome")},
 {g:"Trends",name:"Katzenauge",sub:"Smaragd mit Magnetstreifen",d:D("oval",1.6,"#0F6B4F","#B9E3CE","uni","cateye")},
 {g:"Trends",name:"Aura",sub:"Pinkes Leuchten in der Mitte",d:D("mandel",2,"#F9D5E2","#F24C8D","aura")},
 {g:"Trends",name:"Sunset",sub:"Ombré Mandarine zu Pink",d:D("mandel",2.1,"#F28A1E","#F24C8D","ombre")},
 {g:"Trends",name:"Mokka-Jelly",sub:"Durchscheinend, kurz",d:D("squoval",1.3,"#7B4B3A","#FBFAF8","uni","jelly")},
 {g:"Trends",name:"Mitternacht",sub:"Stiletto, Glitzer, Sterne",d:D("stiletto",2.5,"#15183A","#D9C2A0","uni","glitter"),o:{3:{pattern:"stars",finish:"gloss"}}},
 {g:"Verspielt",name:"Blumenwiese",sub:"Babyblau mit Blüten",d:D("round",1.15,"#B5D4EE","#FBFAF8"),o:{0:{pattern:"flowers",color:"#F3E1DC"},3:{pattern:"flowers",color:"#F3E1DC"}}},

function hexRgb(h){h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}

function rgbHex(r,g,b){return"#"+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,"0")).join("").toUpperCase()}
function rgbHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6}return[h*360,s,l]}
function hslHex(h,s,l){h=((h%360)+360)%360/360;s=clamp(s,0,1);l=clamp(l,0,1);const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;

function nailPath(w,L,shape){

  switch(shape){
    case"square":corner(.07*w);break;
    case"squoval":corner(.27*w);break;
    case"round":dome(Math.min(.5*w,L-b),.56);break;
    case"oval":dome(Math.min(.95*w,L-b),.5);break;
    case"mandel":dome(Math.min(1.35*w,L-b),.2);break;
    case"stiletto":{const t=L-b-.05*w;p.lineTo(h,-L+t);p.bezierCurveTo(h*.86,-L+t*.55,h*.14,-L+.1*w,0,-L);p.bezierCurveTo(-h*.14,-L+.1*w,-h*.86,-L+t*.55,-h,-L+t);break}
    case"ballerina":{const t=Math.min(1.5*w,L-b),tw=.27*w,r=.05*w;p.lineTo(h,-L+t);p.lineTo(tw+r*.6,-L+r*1.4);p.quadraticCurveTo(tw,-L,tw-r,-L);
      p.lineTo(-tw+r,-L);p.quadraticCurveTo(-tw,-L,-tw-r*.6,-L+r*1.4);p.lineTo(-h,-L+t);break}
    case"lipstick":{const s=Math.min(.6*w,(L-b)*.7),r=.07*w;p.lineTo(h,-L+r);p.quadraticCurveTo(h,-L,h-r,-L+r*.55);p.lineTo(-h+r,-L+s-r*.3);p.quadraticCurveTo(-h,-L+s,-h,-L+s+r);break}
    default:corner(.27*w);
  }

}

function soft(c,cx,cy,rx,ry,rot,col,a){c.save();c.translate(cx,cy);c.rotate(rot);c.scale(rx,ry);const g=c.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,rgba(col,a));g.addColorStop(.5,rgba(col,a*.55));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(-1,-1,2,2);c.restore()}

function drawNail(c,n,d,idx,k,seed,shade){
  const w=n.w,L=w*d.len*(n.f||1),path=nailPath(w,L,d.shape);

  const rb=el("div","rowbtns"),auto=sbtn("Hand automatisch erkennen",()=>autoPlace(true));auto.id="autoBtn";auto.hidden=true;rb.appendChild(auto);rb.appendChild(sbtn("Zurück auf Anfang",()=>{commit();defaultNails();refresh()}));s.appendChild(rb);panes.pos.appendChild(s);panes.pos._auto=auto;
  s=section("Feinjustieren");const nm=el("p","hint");nm.id="posName";s.appendChild(nm);
  const N=()=>S.nails[Math.max(0,S.target)];
  const f1=range("posW","Breite",8,640,1,v=>Math.round(v)+" px",()=>N().w,v=>{N().w=v;draw()}),
        f2=range("posA","Drehung",-180,180,1,v=>Math.round(v)+"°",()=>Math.round(N().a*180/Math.PI),v=>{N().a=v*Math.PI/180;draw()}),
        f3=range("posF","Länge an die Perspektive anpassen",.5,1.5,.01,v=>Math.round(v*100)+" %",()=>N().f||1,v=>{N().f=v;draw()}),
        f4=range("posAll","Alle Nägel grösser oder kleiner",.5,2,.01,v=>Math.round(v*100)+" %",()=>1,v=>{const k=v/(f4._last||1);f4._last=v;S.nails.forEach(n=>n.w=clamp(n.w*k,8,PW*.4));draw()});
  f4.querySelector("input").addEventListener("change",()=>{f4._last=1;f4.sync();syncPos()});
  const ck=el("label","check"),cb=el("input");cb.type="checkbox";cb.id="posOn";cb.onchange=()=>{commit();N().on=cb.checked;refresh()};ck.appendChild(cb);ck.appendChild(document.createTextNode("Diesen Nagel anzeigen"));
  [f1,f2,f3,ck,f4].forEach(x=>s.appendChild(x));panes.pos.appendChild(s);panes.pos._f=[f1,f2,f3,f4];panes.pos._cb=cb;panes.pos._nm=nm;
  buildLooks();
}
function buildLooks(){const p=panes.looks;p.textContent="";
  const sk=skinLooks();if(sk.length){const s=section(S.demo?"Passend zum Hautton":"Passend zu deinem Hautton");const gd=el("div","grid looks");sk.forEach(l=>gd.appendChild(lookCard(l)));s.appendChild(gd);
    s.appendChild(el("p","hint","Berechnet aus der Hautfarbe direkt hinter den Nägeln im Foto."));p.appendChild(s)}
  ["Klassiker","Trends","Verspielt"].forEach(gn=>{const s=section(gn),gd=el("div","grid looks");LOOKS.filter(l=>l.g===gn).forEach(l=>gd.appendChild(lookCard(l)));s.appendChild(gd);p.appendChild(s)});
  const s=section("Zufallsmix",sbtn("Neu mischen",()=>{makeMix();buildLooks()})),gd=el("div","grid looks");S.mix.forEach(l=>gd.appendChild(lookCard(l)));s.appendChild(gd);p.appendChild(s);
  const fs=section("Gemerkt",sbtn("Aktuellen Look merken",()=>{const d=S.design;S.favs.unshift({name:nameOf(SHAPES,d.shape)+" · "+colorLabel(d.color),sub:nameOf(PATTERNS,d.pattern)+", "+nameOf(FINISHES,d.finish),d:Object.assign({},d),o:Object.assign({},S.over.map(o=>o||undefined))});
    S.favs=S.favs.slice(0,24);persist();buildLooks();toast("Look gemerkt")}));
  if(S.favs.length){const g2=el("div","grid looks");S.favs.forEach((l,i)=>g2.appendChild(lookCard(l,()=>{S.favs.splice(i,1);persist();buildLooks()})));fs.appendChild(g2)}
  else fs.appendChild(el("p","hint","Noch nichts gemerkt. Gefällt dir ein Design, merk es dir hier und vergleiche später."));
  p.appendChild(fs)}
let skinT=0;function refreshSkin(){clearTimeout(skinT);skinT=setTimeout(buildLooks,400)}

function syncPos(){const p=panes.pos;if(!p._f)return;const i=Math.max(0,S.target);p._nm.textContent=S.target<0?"Tippe im Foto einen Nagel an.":FINGERS[i];p._f.forEach(f=>f.sync());p._cb.checked=S.nails[i].on}
let thumbT=0;function thumbsSoon(){cancelAnimationFrame(thumbT);thumbT=requestAnimationFrame(thumbs)}
function thumbs(){const d=cur(),ti=Math.max(0,S.target);
  if(S.tab==="shape")panes.shape._grid.querySelectorAll(".opt").forEach(b=>thumb(b.firstChild,Object.assign({},d,{shape:b.dataset.k,len:1.75}),ti));
  if(S.tab==="pattern")panes.pattern._grid.querySelectorAll(".opt").forEach(b=>thumb(b.firstChild,Object.assign({},d,{pattern:b.dataset.k,len:1.75,shape:"squoval"}),ti));
  if(S.tab==="finish")panes.finish._grid.querySelectorAll(".opt").forEach(b=>thumb(b.firstChild,Object.assign({},d,{finish:b.dataset.k,len:1.75,shape:"squoval"}),ti))}
function syncAll(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  TABS.forEach(t=>panes[t[0]].hidden=t[0]!==S.tab);
  const tg=$("target");tg.hidden=S.tab==="looks"||S.tab==="shape";tg.textContent="";
  if(!tg.hidden){tg.appendChild(el("span","lbl",S.tab==="pos"?"Nagel":"Gilt für"));
    if(S.tab!=="pos"){const a=el("button","pill","Alle Nägel");a.type="button";a.setAttribute("aria-pressed",S.target<0);a.onclick=()=>setTarget(-1);tg.appendChild(a)}
    FINGERS.forEach((f,i)=>{const b=el("button","pill",f);b.type="button";b.setAttribute("aria-pressed",S.target===i);if(S.over[i]&&S.tab!=="pos"){b.appendChild(el("span","dot"));b.title="Eigenes Design"}b.onclick=()=>setTarget(i);tg.appendChild(b)});
    if(S.tab!=="pos"&&S.target>=0&&S.over[S.target]){const r=el("button","pill","Wie die anderen");r.type="button";r.onclick=()=>{commit();S.over[S.target]=null;refresh()};tg.appendChild(r)}}
  const d=cur();
  panes.shape._grid.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===S.design.shape));panes.shape._len.sync();
  panes.pattern._grid.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===d.pattern));panes.pattern._dice.hidden=RANDOM_PATTERNS.indexOf(d.pattern)<0&&d.finish!=="glitter";
  panes.finish._grid.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===d.finish));panes.finish._shade.sync();
  panes.color._slots.querySelectorAll(".slot").forEach(b=>{const k=b.dataset.k;b.setAttribute("aria-pressed",S.slot===k);b.querySelector(".tip").style.background=d[k];b.querySelector(".n").textContent=colorLabel(d[k])});
  panes.color._pal.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c.toUpperCase()===d[S.slot].toUpperCase()));
  try{panes.color._own.value=d[S.slot].slice(0,7)}catch(e){}
  syncPos();thumbs();$("demoBadge").hidden=!S.demo||S.tab==="pos";panes.pos._auto.hidden=S.demo||detFail}
function refresh(){syncAll();draw();persist()}

/* ---------- Foto laden ---------- */
function defaultNails(){const m=Math.min(PW,PH),cx=PW/2,cy=PH/2,w=m*.07;
  S.nails=[[-.3,.12,-.62,1.15],[-.14,-.2,-.14,1],[0,-.27,0,1.04],[.14,-.22,.12,.98],[.26,-.1,.28,.84]].map(p=>({x:cx+p[0]*m,y:cy+p[1]*m,a:p[2],w:w*p[3],f:1,on:true}))}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3600)}
async function decode(file){if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
  return await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u})}
function setPhoto(src,w,h){const k=Math.min(1,1600/Math.max(w,h));PW=Math.max(1,Math.round(w*k));PH=Math.max(1,Math.round(h*k));photo=document.createElement("canvas");photo.width=PW;photo.height=PH;const c=photo.getContext("2d");c.imageSmoothingQuality="high";c.drawImage(src,0,0,PW,PH);view.z=1;view.ox=view.oy=0}
async function onFile(file){if(!file)return;let im;try{im=await decode(file)}catch(e){toast("Dieses Bild liess sich nicht öffnen. Versuch es mit einem JPG oder PNG.");return}
  await usePhoto(im,im.width,im.height,()=>{if(im.close)im.close()})}
async function usePhoto(im,w,h,done){
  history.length=0;$("undoBtn").disabled=true;setPhoto(im,w,h);if(done)done();S.demo=false;defaultNails();S.target=-1;fit();refresh();buildLooks();
  try{store(PKEY,photo.toDataURL("image/jpeg",.85))}catch(e){}
  const ok=await autoPlace(false);
  if(!ok){S.tab="pos";S.target=1;syncAll();draw();toast("Zieh jetzt die fünf Nägel auf deine eigenen.")}}
$("camInput").addEventListener("change",e=>{onFile(e.target.files[0]);e.target.value=""});
/* Am Computer öffnet «Foto aufnehmen» die Webcam, am Handy die Kamera-App. */
let camStream=null;
const coarse=window.matchMedia&&window.matchMedia("(pointer:coarse)").matches;
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}$("camVideo").srcObject=null;$("cam").hidden=true}
async function openCam(){try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}},audio:false});
    const v=$("camVideo");v.srcObject=camStream;$("cam").hidden=false;try{await v.play()}catch(e){}$("camShot").focus()}
  catch(e){stopCam();toast("Die Kamera ist nicht verfügbar. Wähle ein Foto über «Galerie».")}}
$("camInput").addEventListener("click",e=>{if(!coarse&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){e.preventDefault();openCam()}});
$("camCancel").onclick=stopCam;
$("camShot").onclick=()=>{const v=$("camVideo"),w=v.videoWidth,h=v.videoHeight;if(!w||!h){toast("Die Kamera liefert noch kein Bild.");return}
  const c=mkCanvas(w,h);c.getContext("2d").drawImage(v,0,0,w,h);stopCam();usePhoto(c,w,h)};
$("fileInput").addEventListener("change",e=>{onFile(e.target.files[0]);e.target.value=""});
const stage=$("stage");stage.addEventListener("dragover",e=>e.preventDefault());stage.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&/^image\//.test(f.type))onFile(f)});

/* ---------- Hand automatisch erkennen (optional) ---------- */
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";
let det=null,detFail=false,detBusy=false,edits=0;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.crossOrigin="anonymous";s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
function within(p,ms){return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))])}
async function getDet(){if(det)return det;if(detFail)return null;try{await loadScript(MP+"hands.js");if(!window.Hands)throw new Error("no hands");
    const h=new window.Hands({locateFile:f=>MP+f});h.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.3,minTrackingConfidence:.3});await h.initialize();det=h;return h}catch(e){detFail=true;return null}}
async function findHand(){const h=await within(getDet(),30000);if(!h){detFail=true;return null}
  return await within(new Promise(res=>{h.onResults(r=>res((r.multiHandLandmarks&&r.multiHandLandmarks[0])||null));Promise.resolve(h.send({image:photo})).catch(()=>res(null))}),20000)}
async function autoPlace(manual){if(detBusy||detFail)return false;detBusy=true;const btn=panes.pos._auto;btn.disabled=true;toast("Suche die Hand im Foto …");const e0=edits;
  let lm=null;try{lm=await findHand()}catch(e){lm=null}
  detBusy=false;btn.disabled=false;btn.hidden=detFail;
  if(!lm){if(manual)toast(detFail?"Die automatische Erkennung steht hier nicht zur Verfügung.":"Keine Hand gefunden. Zieh die Nägel von Hand an ihren Platz.");return false}
  if(!manual&&edits!==e0)return true;
  commit();const tips=[[3,4],[7,8],[11,12],[15,16],[19,20]];
  S.nails=tips.map((t,i)=>{const d=lm[t[0]],p=lm[t[1]],dx=(p.x-d.x)*PW,dy=(p.y-d.y)*PH,l=Math.hypot(dx,dy)||1,w=l*(i===0?.7:.64);
    return{x:d.x*PW+dx*.45,y:d.y*PH+dy*.45,a:Math.atan2(dx,-dy),w:clamp(w,8,PW*.4),f:1,on:true}});
  refresh();buildLooks();toast("Hand erkannt. Unter «Position» kannst du jeden Nagel nachrücken.");return true}

/* ---------- Bild sichern ---------- */
function exportBlob(){const c=mkCanvas(PW,PH),x=c.getContext("2d");x.drawImage(photo,0,0);S.nails.forEach((n,i)=>{if(n.on)drawNail(x,n,eff(i),i,1,S.seed,S.shade)});
  return new Promise(res=>c.toBlob(b=>res(b),"image/png"))}
function showSheet(blob){const img=$("sheetImg");if(img.dataset.u)URL.revokeObjectURL(img.dataset.u);const u=URL.createObjectURL(blob);img.dataset.u=u;img.src=u;$("sheet").hidden=false;$("sheetClose").focus()}
$("sheetClose").onclick=()=>{$("sheet").hidden=true};$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").hidden=true});
$("saveBtn").onclick=async()=>{const blob=await exportBlob();if(!blob){toast("Das Bild konnte nicht erstellt werden.");return}
  if(coarse&&navigator.canShare&&window.File){try{const f=new File([blob],"nagelprobe.png",{type:"image/png"});
      if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Nagelprobe"});return}}catch(e){if(e&&e.name==="AbortError")return}}
  try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="nagelprobe.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast("Bild gesichert");return}catch(e){}
  showSheet(blob)};

/* ---------- Start ---------- */
function restore(){const raw=load(KEY);if(!raw)return null;try{return JSON.parse(raw)}catch(e){return null}}
function start(){const saved=restore();makeMix();
  const finish=()=>{build();layout();syncAll()};
  if(saved&&saved.favs)S.favs=saved.favs;
  const p=saved&&!saved.demo?load(PKEY):null;
  if(p&&saved.nails&&saved.nails.length===5){const im=new Image();im.onload=()=>{setPhoto(im,im.width,im.height);Object.assign(S,{design:saved.design,over:saved.over,nails:saved.nails,seed:saved.seed||1,shade:saved.shade||0,demo:false});if(saved.tab&&panes)S.tab=saved.tab;finish()};
    im.onerror=()=>{demoHand();finish()};im.src=p}
  else{demoHand();if(saved&&saved.demo&&saved.design){S.design=saved.design;S.over=saved.over||S.over;S.seed=saved.seed||S.seed}finish()}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
}
start();
})();
</script>
</body>
